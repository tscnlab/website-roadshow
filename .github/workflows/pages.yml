name: Publish archive to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the archive
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install beautifulsoup4==4.14.3 html5lib==1.1
      - name: Check the committed archive
        run: |
          test -s docs/index.html
          test -s docs/archive/index.html
          test -f docs/.nojekyll
          python scripts/archive_site.py validate
      - name: Upload the website artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to roadshow.tscnlab.org
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Verify the configured custom domain
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: |
          if [ "$PAGES_HOST" != 'roadshow.tscnlab.org' ]; then
            echo '::error::Set the repository Pages custom domain to roadshow.tscnlab.org before deploying.'
            exit 1
          fi
      - name: Deploy the validated archive
        id: deployment
        uses: actions/deploy-pages@v5
